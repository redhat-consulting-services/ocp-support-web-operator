name: Build and Push

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  OPERATOR_IMAGE: quay.io/redhat-consulting-services/ocp-support-web-operator
  BUNDLE_IMAGE: quay.io/redhat-consulting-services/ocp-support-web-operator-bundle
  BUILDER_IMAGE: registry.redhat.io/ubi9/go-toolset:latest
  RUNTIME_IMAGE: registry.redhat.io/ubi9/ubi-micro:latest

jobs:
  build-operator:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Red Hat registry
        uses: docker/login-action@v3
        with:
          registry: registry.redhat.io
          username: ${{ secrets.REDHAT_REGISTRY_USER }}
          password: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            {
              echo "tags<<EOF"
              echo "${TAG}"
              echo "latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "tags=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build operator image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.OPERATOR_IMAGE }}
          tags: ${{ steps.version.outputs.tags }}
          containerfiles: ./Containerfile
          build-args: |
            BUILDER_IMAGE=${{ env.BUILDER_IMAGE }}
            RUNTIME_IMAGE=${{ env.RUNTIME_IMAGE }}

      - name: Log in to Quay.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}

      - name: Push operator to Quay.io
        if: github.event_name == 'push'
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ocp-support-web-operator
          registry: quay.io/redhat-consulting-services
          tags: ${{ steps.version.outputs.tags }}

      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  build-bundle:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-operator
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${TAG}"
            echo "latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build bundle image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.BUNDLE_IMAGE }}
          tags: ${{ steps.version.outputs.tags }}
          containerfiles: ./bundle/Containerfile
          context: ./bundle

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}

      - name: Push bundle to Quay.io
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ocp-support-web-operator-bundle
          registry: quay.io/redhat-consulting-services
          tags: ${{ steps.version.outputs.tags }}

