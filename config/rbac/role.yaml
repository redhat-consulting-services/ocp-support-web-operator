apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ocp-support-web-operator-role
rules:
  - apiGroups: ["support.openshift.io"]
    resources: ["ocpsupportwebs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["support.openshift.io"]
    resources: ["ocpsupportwebs/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["support.openshift.io"]
    resources: ["ocpsupportwebs/finalizers"]
    verbs: ["update"]
  - apiGroups: ["support.openshift.io"]
    resources: ["supportgathers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["support.openshift.io"]
    resources: ["supportgathers/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["support.openshift.io"]
    resources: ["supportgathers/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["serviceaccounts", "services", "secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings", "clusterroles"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "escalate"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["config.openshift.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["console.openshift.io"]
    resources: ["consolelinks"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
