apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  name: ocp-support-web-operator.v3.0.0
  namespace: placeholder
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "support.openshift.io/v1alpha1",
          "kind": "OCPSupportWeb",
          "metadata": {
            "name": "ocpsupportweb"
          },
          "spec": {
            "image": "quay.io/redhat-consulting-services/ocp-support-web:v3.0.0",
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "64Mi"
              },
              "limits": {
                "memory": "512Mi"
              }
            }
          }
        },
        {
          "apiVersion": "support.openshift.io/v1alpha1",
          "kind": "SupportGather",
          "metadata": {
            "name": "example-gather"
          },
          "spec": {
            "gatherTypes": ["all"],
            "anonymize": false
          }
        }
      ]
    capabilities: Full Lifecycle
    categories: Developer Tools
    containerImage: quay.io/redhat-consulting-services/ocp-support-web-operator:v3.0.0
    description: >-
      OpenShift Support Tools in a web app. Native Go-based cluster diagnostics
      with ConfigMap-driven gather definitions, etcd backup, etcd diagnostics,
      cluster status, and ACM multi-cluster support — each ready to download
      from your browser. This is a community operator and is not supported by
      Red Hat.
    repository: https://github.com/redhat-consulting-services/ocp-support-web-operator
    support: Community
    operatorframework.io/suggested-namespace: ocp-support-web
spec:
  displayName: OCP Support Web
  description: |
    ## OCP Support Web Operator

    OpenShift Support Tools in a web app. Native Go-based cluster diagnostics
    with ConfigMap-driven gather definitions, etcd backup, etcd diagnostics,
    cluster status, and ACM multi-cluster support — each ready to download
    from your browser.

    **This is a community operator. It is not supported by Red Hat.**

    ### Features

    - **Native Cluster Diagnostics**: Collects cluster resources, pod logs,
      pod exec commands, and node commands using native Go API calls — no
      external must-gather images required. Supports 20 operator-specific
      gather profiles that auto-detect installed operators. "Gather All"
      dynamically collects from all detected operators.
    - **ConfigMap-Driven Configuration**: Customize what gets collected via
      the `gather-common` ConfigMap. Add custom resources, pod exec commands,
      node commands, and log specifications. Changes take effect on the next
      gather request — no restart needed.
    - **ACM Multi-Cluster Support**: Deploy agents to managed clusters via
      the web UI. Gather diagnostics from remote clusters through ACM.
    - **Etcd Backup**: Create etcd snapshots from master nodes with progress
      tracking and browser download.
    - **Etcd Diagnostics**: Analyze etcd database contents — object sizes,
      counts, namespace breakdowns, creation timelines, and per-namespace
      resource counts.
    - **Cluster Status**: View cluster health, control plane operators, node
      utilization, top consumers (pods and VMs), ODF status, and etcd member
      health at a glance.
    - **Data Anonymization**: Optionally obfuscate IPs, MACs, domain names,
      and Kubernetes secret values before sharing diagnostics with support.
    - **Disconnected Support**: All container image references are configurable
      for air-gapped and mirror registry environments.

    - **Connection Resilience**: WebSocket connections automatically reconnect
      on network interruptions, keeping real-time log streaming reliable
      during long-running gather operations.

    ### Authentication

    Access is restricted via the OpenShift OAuth proxy. Access can be
    granted to specific OpenShift groups using `spec.allowedGroups`
    (defaults to `cluster-admins`).

    ### Disconnected / Air-Gapped Environments

    Container image references are configurable in the CR spec:

    - `spec.image` — the application image (used for web UI and standalone
      must-gather)
    - `spec.agentImage` — the image for ACM remote gather agents (defaults
      to `spec.image` if not set)
    - `spec.oauthProxyImage` — the OAuth proxy sidecar

    For per-cluster agent image overrides (useful when managed clusters use
    different mirror registries), set the `ocp-support-web/agent-image`
    annotation on the ManagedCluster resource.

    The operator supports the OLM `RELATED_IMAGE_*` convention for automatic
    image mirroring via ImageContentSourcePolicy.

    ### Standalone Must-Gather

    The application image can also be used directly as a must-gather image:

    ```
    oc adm must-gather --image=<spec.image>
    ```

    This auto-detects installed operators and collects diagnostics for all
    of them using native Go API calls.

    ### Upgrades

    The operator follows OLM best practices:

    - Operator upgrades are managed via the OLM upgrade graph (replaces chain)
    - Application upgrades happen by updating the CR spec or upgrading the
      operator version (which updates the default RELATED_IMAGE_APP)
    - Rolling updates ensure zero downtime during upgrades
  maturity: alpha
  version: 3.0.0
  replaces: ocp-support-web-operator.v2.2.0
  minKubeVersion: 1.25.0

  keywords:
    - openshift
    - support
    - must-gather
    - etcd
    - diagnostics
    - troubleshooting

  maintainers:
    - name: Kim Borup
      email: kborup@redhat.com

  provider:
    name: Community

  links:
    - name: Documentation
      url: https://github.com/redhat-consulting-services/ocp-support-web-operator

  icon:
    - base64data: 
      mediatype: image/svg+xml

  installModes:
    - type: OwnNamespace
      supported: true
    - type: SingleNamespace
      supported: true
    - type: MultiNamespace
      supported: false
    - type: AllNamespaces
      supported: false

  install:
    strategy: deployment
    spec:
      clusterPermissions:
        - serviceAccountName: ocp-support-web-operator
          rules:
            - apiGroups: ["support.openshift.io"]
              resources: ["ocpsupportwebs"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            - apiGroups: ["support.openshift.io"]
              resources: ["ocpsupportwebs/status"]
              verbs: ["get", "update", "patch"]
            - apiGroups: ["support.openshift.io"]
              resources: ["ocpsupportwebs/finalizers"]
              verbs: ["update"]
            - apiGroups: ["support.openshift.io"]
              resources: ["supportgathers"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            - apiGroups: ["support.openshift.io"]
              resources: ["supportgathers/status"]
              verbs: ["get", "update", "patch"]
            - apiGroups: ["support.openshift.io"]
              resources: ["supportgathers/finalizers"]
              verbs: ["update"]
            - apiGroups: [""]
              resources: ["serviceaccounts", "services", "secrets", "configmaps"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            - apiGroups: ["apps"]
              resources: ["deployments"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            - apiGroups: ["rbac.authorization.k8s.io"]
              resources: ["clusterrolebindings", "clusterroles"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "escalate", "bind"]
            - apiGroups: ["route.openshift.io"]
              resources: ["routes"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            - apiGroups: ["config.openshift.io"]
              resources: ["ingresses"]
              verbs: ["get", "list"]
            - apiGroups: ["monitoring.coreos.com"]
              resources: ["servicemonitors"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            - apiGroups: ["coordination.k8s.io"]
              resources: ["leases"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            - apiGroups: [""]
              resources: ["events"]
              verbs: ["create", "patch"]
      deployments:
        - name: ocp-support-web-operator
          spec:
            replicas: 1
            selector:
              matchLabels:
                control-plane: controller-manager
            template:
              metadata:
                labels:
                  control-plane: controller-manager
              spec:
                serviceAccountName: ocp-support-web-operator
                securityContext:
                  runAsNonRoot: true
                containers:
                  - name: manager
                    image: quay.io/redhat-consulting-services/ocp-support-web-operator:v3.0.0
                    command: ["/manager"]
                    env:
                      - name: WATCH_NAMESPACE
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.namespace
                      - name: RELATED_IMAGE_APP
                        value: quay.io/redhat-consulting-services/ocp-support-web:v3.0.0
                      - name: RELATED_IMAGE_OAUTH_PROXY
                        value: registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:latest
                    ports:
                      - containerPort: 8080
                        name: metrics
                      - containerPort: 8081
                        name: health
                    livenessProbe:
                      httpGet:
                        path: /healthz
                        port: 8081
                      initialDelaySeconds: 15
                      periodSeconds: 20
                    readinessProbe:
                      httpGet:
                        path: /readyz
                        port: 8081
                      initialDelaySeconds: 5
                      periodSeconds: 10
                    resources:
                      requests:
                        cpu: 10m
                        memory: 64Mi
                      limits:
                        memory: 128Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                terminationGracePeriodSeconds: 10

  customresourcedefinitions:
    owned:
      - name: ocpsupportwebs.support.openshift.io
        version: v1alpha1
        kind: OCPSupportWeb
        displayName: OCP Support Web
        description: >-
          Deploys the OCP Support Web application with OAuth authentication,
          must-gather, etcd tools, and cluster status dashboard.
        specDescriptors:
          - path: image
            displayName: Application Image
            description: >-
              Container image for the OCP Support Web application. This same
              image is used for the web UI, ACM remote agents, and as a
              standalone must-gather image. For disconnected environments,
              set this to your mirrored registry location.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Images
          - path: agentImage
            displayName: Agent Image
            description: >-
              Container image for ACM remote gather agents on managed clusters.
              Defaults to the application image. Can also be overridden per
              managed cluster via the ocp-support-web/agent-image annotation.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Images
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - path: oauthProxyImage
            displayName: OAuth Proxy Image
            description: >-
              Container image for the OpenShift OAuth proxy sidecar.
              Leave empty to use the default (registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:latest).
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Images
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - path: clusterDomain
            displayName: Cluster Domain
            description: >-
              Cluster apps domain (e.g. apps.mycluster.example.com).
              Auto-detected from the cluster Ingress config if not set.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Networking
          - path: route.host
            displayName: Route Hostname
            description: >-
              Custom hostname for the Route. If not set, OpenShift generates
              one automatically based on the cluster domain.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Networking
          - path: resources
            displayName: App Resources
            description: Resource requests and limits for the application container.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:resourceRequirements
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Resources
          - path: oauthProxyResources
            displayName: OAuth Proxy Resources
            description: Resource requests and limits for the OAuth proxy sidecar.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:resourceRequirements
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Resources
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - path: allowedGroups
            displayName: Allowed Groups
            description: >-
              OpenShift groups allowed to access the application. Enforced by
              the OAuth proxy. Defaults to ["cluster-admins"].
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Authentication
        statusDescriptors:
          - path: phase
            displayName: Phase
            description: Current deployment phase.
            x-descriptors:
              - urn:alm:descriptor:io.kubernetes.phase
          - path: routeURL
            displayName: Route URL
            description: External URL for the application.
            x-descriptors:
              - urn:alm:descriptor:org.w3:link
          - path: conditions
            displayName: Conditions
            description: Deployment conditions.
            x-descriptors:
              - urn:alm:descriptor:io.kubernetes.conditions
      - name: supportgathers.support.openshift.io
        version: v1alpha1
        kind: SupportGather
        displayName: Support Gather
        description: >-
          Triggers a must-gather operation via the OCP Support Web backend.
          Optionally uploads the resulting archive to a Red Hat support case.
        specDescriptors:
          - path: gatherTypes
            displayName: Gather Types
            description: >-
              Which must-gather types to run. Use ["all"] for all detected
              operators, or specify individual types like ["virtualization", "odf"].
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
          - path: anonymize
            displayName: Anonymize
            description: Enable data anonymization in the gathered archive.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
          - path: upload.caseID
            displayName: Case ID
            description: Red Hat support case number for automatic upload.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
        statusDescriptors:
          - path: phase
            displayName: Phase
            description: "Current state: Pending, Gathering, Uploading, Complete, Failed."
            x-descriptors:
              - urn:alm:descriptor:io.kubernetes.phase
          - path: progress
            displayName: Progress
            description: Gather completion percentage (0-100).
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
          - path: conditions
            displayName: Conditions
            description: Detailed status conditions.
            x-descriptors:
              - urn:alm:descriptor:io.kubernetes.conditions

  relatedImages:
    - name: app
      image: quay.io/redhat-consulting-services/ocp-support-web:v3.0.0
    - name: oauth-proxy
      image: registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:latest
