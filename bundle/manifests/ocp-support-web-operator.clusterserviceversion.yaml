      image: registry.redhat.io/compliance/openshift-compliance-must-gather-rhel8:latest
    - name: must-gather-mce
      image: registry.redhat.io/multicluster-engine/must-gather-rhel8
    - name: must-gather-netobserv
      image: quay.io/netobserv/must-gather
