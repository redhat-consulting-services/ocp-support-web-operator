apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  name: ocp-support-web-operator.v2.0.1
  namespace: placeholder
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "support.openshift.io/v1alpha1",
          "kind": "OCPSupportWeb",
          "metadata": {
            "name": "ocpsupportweb"
          },
          "spec": {
            "image": "quay.io/redhat-consulting-services/ocp-support-web:v2.0.1",
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "64Mi"
              },
              "limits": {
                "memory": "512Mi"
              }
            }
          }
        }
      ]
    capabilities: Full Lifecycle
    categories: Developer Tools
    containerImage: quay.io/redhat-consulting-services/ocp-support-web-operator:v2.0.1
    description: >-
      OpenShift Support Tools in a web app. Expose the most common tools used
      for Red Hat support cases through a web application — must-gather, etcd
      backup, etcd diagnostics, and cluster status — each ready to download and
      ship from your laptop. This is a community operator and is not supported
      by Red Hat.
    repository: https://github.com/redhat-consulting-services/ocp-support-web-operator
    support: Community
    operatorframework.io/suggested-namespace: ocp-support-web
spec:
  displayName: OCP Support Web
  description: |
    ## OCP Support Web Operator

    OpenShift Support Tools in a web app. Expose the most common tools used for
    Red Hat support cases through a web application — must-gather, etcd backup,
    etcd diagnostics, and cluster status — each ready to download and ship from
    your laptop.

    **This is a community operator. It is not supported by Red Hat.**

    ### Features

    - **Must-Gather**: Run must-gather for Default, Virtualization (CNV), ODF,
      ACM, Logging, Service Mesh, Compliance, MTC, GitOps, Serverless, MCE,
      Network Observability, Local Storage, Sandboxed Containers, Node Health
      Check, NUMA Resources, PTP, Secrets Store CSI, LVMS, and audit logs.
      Only installed operators are shown. "Gather All" dynamically collects
      from all detected operators. Download archives directly from your browser.
    - **Etcd Backup**: Create etcd snapshots from master nodes with progress
      tracking and browser download.
    - **Etcd Diagnostics**: Analyze etcd database contents — object sizes,
      counts, namespace breakdowns, creation timelines, and per-namespace
      resource counts.
    - **Cluster Status**: View cluster health, control plane operators, node
      utilization, top consumers (pods and VMs), ODF status, and etcd member
      health at a glance.
    - **Data Anonymization**: Optionally obfuscate IPs, MACs, and domain names
      before sharing diagnostics with support.
    - **Disconnected Support**: All container image references are configurable
      for air-gapped and mirror registry environments.

    ### Authentication

    Access is restricted to cluster-admin users via the OpenShift OAuth proxy.
    Only users who can create namespaces (a cluster-admin privilege) are allowed
    to log in.

    ### Disconnected / Air-Gapped Environments

    Every container image used by the operator and the application is
    configurable. In the CR spec you can override:

    - `spec.image` — the application image
    - `spec.oauthProxyImage` — the OAuth proxy sidecar
    - `spec.mustGatherImages.standard` — Default must-gather image
    - `spec.mustGatherImages.cnv` — Virtualization must-gather image
    - `spec.mustGatherImages.odf` — ODF must-gather image
    - `spec.mustGatherImages.acm` — ACM must-gather image
    - `spec.mustGatherImages.logging` — Logging must-gather image
    - `spec.mustGatherImages.serviceMesh` — Service Mesh must-gather image
    - `spec.mustGatherImages.compliance` — Compliance must-gather image
    - `spec.mustGatherImages.mtc` — MTC must-gather image
    - `spec.mustGatherImages.gitops` — GitOps must-gather image
    - `spec.mustGatherImages.serverless` — Serverless must-gather image
    - `spec.mustGatherImages.mce` — MCE / Hosted Control Planes must-gather image
    - `spec.mustGatherImages.netObserv` — Network Observability must-gather image
    - `spec.mustGatherImages.localStorage` — Local Storage must-gather image
    - `spec.mustGatherImages.sandboxed` — Sandboxed Containers must-gather image
    - `spec.mustGatherImages.nhc` — Node Health Check must-gather image
    - `spec.mustGatherImages.numa` — NUMA Resources must-gather image
    - `spec.mustGatherImages.ptp` — PTP must-gather image
    - `spec.mustGatherImages.secretsStore` — Secrets Store CSI must-gather image
    - `spec.mustGatherImages.lvms` — LVMS must-gather image

    Most must-gather images are auto-detected from installed operator CSVs.
    Only set these for disconnected environments.

    The operator also supports the OLM `RELATED_IMAGE_*` convention for
    automatic image mirroring via ImageContentSourcePolicy.

    ### Upgrades

    The operator follows OLM best practices:

    - Operator upgrades are managed via the OLM upgrade graph (replaces chain)
    - Application upgrades happen by updating the CR spec or upgrading the
      operator version (which updates the default RELATED_IMAGE_APP)
    - Rolling updates ensure zero downtime during upgrades
  maturity: alpha
  version: 2.0.1
  replaces: ocp-support-web-operator.v2.0.0
  minKubeVersion: 1.25.0

  keywords:
    - openshift
    - support
    - must-gather
    - etcd
    - diagnostics
    - troubleshooting

  maintainers:
    - name: Kim Borup
      email: kim@pfy.dk

  provider:
    name: Community

  links:
    - name: Documentation
      url: https://github.com/redhat-consulting-services/ocp-support-web-operator

  icon:
    - base64data: 
      mediatype: image/svg+xml

  installModes:
    - type: OwnNamespace
      supported: true
    - type: SingleNamespace
      supported: true
    - type: MultiNamespace
      supported: false
    - type: AllNamespaces
      supported: false

  install:
    strategy: deployment
    spec:
      clusterPermissions:
        - serviceAccountName: ocp-support-web-operator
          rules:
            - apiGroups: ["support.openshift.io"]
              resources: ["ocpsupportwebs"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            - apiGroups: ["support.openshift.io"]
              resources: ["ocpsupportwebs/status"]
              verbs: ["get", "update", "patch"]
            - apiGroups: ["support.openshift.io"]
              resources: ["ocpsupportwebs/finalizers"]
              verbs: ["update"]
            - apiGroups: [""]
              resources: ["serviceaccounts", "services", "secrets"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            - apiGroups: ["apps"]
              resources: ["deployments"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            - apiGroups: ["rbac.authorization.k8s.io"]
              resources: ["clusterrolebindings"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            - apiGroups: ["rbac.authorization.k8s.io"]
              resources: ["clusterroles"]
              verbs: ["bind"]
              resourceNames: ["cluster-admin"]
            - apiGroups: ["route.openshift.io"]
              resources: ["routes"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            - apiGroups: ["config.openshift.io"]
              resources: ["ingresses"]
              verbs: ["get", "list"]
            - apiGroups: ["monitoring.coreos.com"]
              resources: ["servicemonitors"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            - apiGroups: ["coordination.k8s.io"]
              resources: ["leases"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            - apiGroups: [""]
              resources: ["events"]
              verbs: ["create", "patch"]
      deployments:
        - name: ocp-support-web-operator
          spec:
            replicas: 1
            selector:
              matchLabels:
                control-plane: controller-manager
            template:
              metadata:
                labels:
                  control-plane: controller-manager
              spec:
                serviceAccountName: ocp-support-web-operator
                securityContext:
                  runAsNonRoot: true
                containers:
                  - name: manager
                    image: quay.io/redhat-consulting-services/ocp-support-web-operator:v2.0.1
                    command: ["/manager"]
                    env:
                      - name: WATCH_NAMESPACE
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.namespace
                      - name: RELATED_IMAGE_APP
                        value: quay.io/redhat-consulting-services/ocp-support-web:v2.0.1
                      - name: RELATED_IMAGE_OAUTH_PROXY
                        value: registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:latest
                      - name: RELATED_IMAGE_MUST_GATHER_STANDARD
                        value: registry.redhat.io/openshift4/ose-must-gather-rhel9:latest
                      - name: RELATED_IMAGE_MUST_GATHER_CNV
                        value: ""
                      - name: RELATED_IMAGE_MUST_GATHER_ODF
                        value: ""
                      - name: RELATED_IMAGE_MUST_GATHER_LOGGING
                        value: ""
                      - name: RELATED_IMAGE_MUST_GATHER_SERVICE_MESH
                        value: ""
                      - name: RELATED_IMAGE_MUST_GATHER_COMPLIANCE
                        value: registry.redhat.io/compliance/openshift-compliance-must-gather-rhel8:latest
                      - name: RELATED_IMAGE_MUST_GATHER_MTC
                        value: ""
                      - name: RELATED_IMAGE_MUST_GATHER_GITOPS
                        value: ""
                      - name: RELATED_IMAGE_MUST_GATHER_SERVERLESS
                        value: ""
                      - name: RELATED_IMAGE_MUST_GATHER_MCE
                        value: registry.redhat.io/multicluster-engine/must-gather-rhel8
                      - name: RELATED_IMAGE_MUST_GATHER_NETOBSERV
                        value: quay.io/netobserv/must-gather
                      - name: RELATED_IMAGE_MUST_GATHER_LOCAL_STORAGE
                        value: ""
                      - name: RELATED_IMAGE_MUST_GATHER_SANDBOXED
                        value: ""
                      - name: RELATED_IMAGE_MUST_GATHER_NHC
                        value: ""
                      - name: RELATED_IMAGE_MUST_GATHER_NUMA
                        value: ""
                      - name: RELATED_IMAGE_MUST_GATHER_PTP
                        value: ""
                      - name: RELATED_IMAGE_MUST_GATHER_SECRETS_STORE
                        value: ""
                      - name: RELATED_IMAGE_MUST_GATHER_LVMS
                        value: ""
                    ports:
                      - containerPort: 8080
                        name: metrics
                      - containerPort: 8081
                        name: health
                    livenessProbe:
                      httpGet:
                        path: /healthz
                        port: 8081
                      initialDelaySeconds: 15
                      periodSeconds: 20
                    readinessProbe:
                      httpGet:
                        path: /readyz
                        port: 8081
                      initialDelaySeconds: 5
                      periodSeconds: 10
                    resources:
                      requests:
                        cpu: 10m
                        memory: 64Mi
                      limits:
                        memory: 128Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                terminationGracePeriodSeconds: 10

  customresourcedefinitions:
    owned:
      - name: ocpsupportwebs.support.openshift.io
        version: v1alpha1
        kind: OCPSupportWeb
        displayName: OCP Support Web
        description: >-
          Deploys the OCP Support Web application with OAuth authentication,
          must-gather, etcd tools, and cluster status dashboard.
        specDescriptors:
          - path: image
            displayName: Application Image
            description: >-
              Container image for the OCP Support Web application.
              Leave empty to use the default version bundled with this operator.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Images
          - path: oauthProxyImage
            displayName: OAuth Proxy Image
            description: >-
              Container image for the OpenShift OAuth proxy sidecar.
              Leave empty to use the default (registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:latest).
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Images
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - path: mustGatherImages.standard
            displayName: Standard Must-Gather Image
            description: >-
              Standard OpenShift must-gather image. Leave empty to use the cluster
              release payload's built-in must-gather.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Must-Gather Images
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - path: mustGatherImages.cnv
            displayName: CNV Must-Gather Image
            description: Container image for OpenShift Virtualization must-gather.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Must-Gather Images
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - path: mustGatherImages.odf
            displayName: ODF Must-Gather Image
            description: Container image for ODF (OpenShift Data Foundation) must-gather.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Must-Gather Images
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - path: mustGatherImages.acm
            displayName: ACM Must-Gather Image
            description: >-
              Container image for Advanced Cluster Management must-gather.
              Auto-detected from the installed ACM version if not set.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Must-Gather Images
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - path: mustGatherImages.logging
            displayName: Logging Must-Gather Image
            description: Container image for OpenShift Logging must-gather.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Must-Gather Images
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - path: mustGatherImages.serviceMesh
            displayName: Service Mesh Must-Gather Image
            description: Container image for OpenShift Service Mesh must-gather. Leave empty to auto-detect version.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Must-Gather Images
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - path: mustGatherImages.compliance
            displayName: Compliance Must-Gather Image
            description: Container image for Compliance Operator must-gather.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Must-Gather Images
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - path: mustGatherImages.mtc
            displayName: MTC Must-Gather Image
            description: Container image for Migration Toolkit for Containers must-gather. Leave empty to auto-detect version.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Must-Gather Images
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - path: mustGatherImages.gitops
            displayName: GitOps Must-Gather Image
            description: Container image for OpenShift GitOps must-gather. Leave empty to auto-detect version.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Must-Gather Images
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - path: mustGatherImages.serverless
            displayName: Serverless Must-Gather Image
            description: Container image for OpenShift Serverless must-gather. Leave empty to auto-detect version.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Must-Gather Images
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - path: mustGatherImages.mce
            displayName: MCE Must-Gather Image
            description: Container image for Multicluster Engine / Hosted Control Planes must-gather.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Must-Gather Images
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - path: mustGatherImages.netObserv
            displayName: Network Observability Must-Gather Image
            description: Container image for Network Observability must-gather.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Must-Gather Images
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - path: mustGatherImages.localStorage
            displayName: Local Storage Must-Gather Image
            description: Container image for Local Storage Operator must-gather. Leave empty to auto-detect version.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Must-Gather Images
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - path: mustGatherImages.sandboxed
            displayName: Sandboxed Containers Must-Gather Image
            description: Container image for OpenShift Sandboxed Containers must-gather. Leave empty to auto-detect version.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Must-Gather Images
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - path: mustGatherImages.nhc
            displayName: Node Health Check Must-Gather Image
            description: Container image for Workload Availability / Node Health Check must-gather. Leave empty to auto-detect version.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Must-Gather Images
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - path: mustGatherImages.numa
            displayName: NUMA Resources Must-Gather Image
            description: Container image for NUMA Resources Operator must-gather. Leave empty to auto-detect version.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Must-Gather Images
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - path: mustGatherImages.ptp
            displayName: PTP Must-Gather Image
            description: Container image for PTP Operator must-gather. Leave empty to auto-detect version.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Must-Gather Images
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - path: mustGatherImages.secretsStore
            displayName: Secrets Store CSI Must-Gather Image
            description: Container image for Secrets Store CSI Driver Operator must-gather. Leave empty to auto-detect version.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Must-Gather Images
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - path: mustGatherImages.lvms
            displayName: LVMS Must-Gather Image
            description: Container image for LVM Storage Operator must-gather. Leave empty to auto-detect version.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Must-Gather Images
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - path: clusterDomain
            displayName: Cluster Domain
            description: >-
              Cluster apps domain (e.g. apps.mycluster.example.com).
              Auto-detected from the cluster Ingress config if not set.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Networking
          - path: route.host
            displayName: Route Hostname
            description: >-
              Custom hostname for the Route. If not set, OpenShift generates
              one automatically based on the cluster domain.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Networking
          - path: resources
            displayName: App Resources
            description: Resource requests and limits for the application container.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:resourceRequirements
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Resources
          - path: oauthProxyResources
            displayName: OAuth Proxy Resources
            description: Resource requests and limits for the OAuth proxy sidecar.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:resourceRequirements
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Resources
              - urn:alm:descriptor:com.tectonic.ui:advanced
        statusDescriptors:
          - path: phase
            displayName: Phase
            description: Current deployment phase.
            x-descriptors:
